name: Build & Release APK

# Push a tag like v0.1.0 to build an installable APK and attach it to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 액션 기본값(packages: "tools platform-tools")의 legacy "tools" 패키지가 Google SDK
          # 저장소에서 없어져서 "Failed to find package 'tools'"로 매번 실패하게 됨(2026-09-17,
          # 이전 릴리스들까지는 문제없었는데 러너 이미지가 바뀌며 갑자기 깨짐) — Gradle 빌드 자체는
          # platform-tools 하나면 충분하고, compileSdk/build-tools는 AGP가 알아서 받아온다.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK with version tag
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/daymory-${TAG}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: g1-sketchbook-debug
          path: app/build/outputs/apk/debug/daymory-*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/daymory-*.apk
